name: Publish daily Top Funds

on:
  schedule:
    - cron: "30 13 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate daily fund data
        run: python .github/scripts/update-top-funds.py

      - name: Create or update release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view daily-top-funds >/dev/null 2>&1 || gh release create daily-top-funds \
            --title "Daily Top Funds" \
            --notes "Automated daily Top Funds data. Generated at 7:00 PM IST from MFAPI NAV history." \
            --prerelease
          gh release upload daily-top-funds top-funds.json --clobber
