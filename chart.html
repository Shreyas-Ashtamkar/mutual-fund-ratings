<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fund Lens | NAV Chart</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer">
  <style>
    :root { --ink: #17221c; --muted: #6d786f; --line: #dce4de; --surface: #ffffff; --canvas: #f3f6f2; --accent: #246b52; --accent-soft: #e4f1e9; }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--canvas); color: var(--ink); font-family: Georgia, "Times New Roman", serif; }
    main { max-width: 1000px; margin: 0 auto; padding: 40px 24px; }
    a { color: var(--accent); font: 700 .78rem Arial, sans-serif; text-decoration: none; }
    a:hover { text-decoration: underline; }
    .eyebrow { margin: 25px 0 8px; color: var(--accent); font: 700 .7rem Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    h1 { max-width: 760px; margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); line-height: 1.05; font-weight: 500; }
    .subhead { margin: 12px 0 24px; color: var(--muted); font: .85rem/1.5 Arial, sans-serif; }
    .chart-panel { padding: 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
    .chart-meta { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-bottom: 20px; }
    .nav-label { color: var(--muted); font: .72rem Arial, sans-serif; text-transform: uppercase; letter-spacing: .08em; }
    .nav-value { margin-top: 5px; font-size: 1.5rem; }
    .range-tabs { display: flex; gap: 5px; }
    .range-tabs button { padding: 8px 10px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--muted); font: 700 .72rem Arial, sans-serif; cursor: pointer; }
    .range-tabs button.is-active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    canvas { display: block; width: 100%; height: 350px; }
    .message { padding: 42px 10px; color: var(--muted); font: .9rem/1.5 Arial, sans-serif; text-align: center; }
    .notice { margin: 16px 2px 0; color: var(--muted); font: .76rem/1.5 Arial, sans-serif; }
    @media (max-width: 600px) { main { padding: 24px 14px; } .chart-panel { padding: 14px; } .chart-meta { align-items: flex-start; flex-direction: column; gap: 12px; } .range-tabs { width: 100%; } .range-tabs button { flex: 1; } canvas { height: 270px; } }
  </style>
</head>
<body>
  <main>
    <a href="index.html"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Back to Fund Lens</a>
    <p class="eyebrow">Historical NAV view</p>
    <h1 id="fund-name">Loading fund chart...</h1>
    <p id="fund-category" class="subhead"></p>
    <section class="chart-panel" aria-label="Historical NAV chart">
      <div class="chart-meta">
        <div><div class="nav-label">Latest NAV</div><div id="latest-nav" class="nav-value">--</div></div>
        <div class="range-tabs" aria-label="Chart range"><button type="button" data-months="6">6M</button><button class="is-active" type="button" data-months="12">1Y</button><button type="button" data-months="36">3Y</button></div>
      </div>
      <canvas id="nav-chart" role="img" aria-label="NAV history chart"></canvas>
      <p id="chart-message" class="message">Loading public NAV history...</p>
    </section>
    <p class="notice">NAV history is supplied by MFAPI. This chart is informational and algorithmic; review all fund documents and your personal risk profile before making decisions.</p>
  </main>
  <script>
    const baseUrl = 'https://api.mfapi.in/mf';
    const params = new URLSearchParams(location.search);
    const requestedName = params.get('name') || '';
    const providedCode = params.get('code');
    const canvas = document.getElementById('nav-chart');
    const context = canvas.getContext('2d');
    const message = document.getElementById('chart-message');
    let history = [];
    let months = 12;

    function parseDate(value) { const [day, month, year] = value.split('-').map(Number); return new Date(year, month - 1, day); }
    function resizeCanvas() { const ratio = devicePixelRatio || 1; const box = canvas.getBoundingClientRect(); canvas.width = box.width * ratio; canvas.height = box.height * ratio; context.setTransform(ratio, 0, 0, ratio, 0, 0); }
    function draw() {
      resizeCanvas();
      const width = canvas.clientWidth; const height = canvas.clientHeight; const padding = { top: 18, right: 16, bottom: 28, left: 50 };
      const start = new Date(history[history.length - 1].date); start.setMonth(start.getMonth() - months);
      const points = history.filter((item) => item.date >= start);
      if (points.length < 2) return;
      const values = points.map((item) => item.nav); const min = Math.min(...values); const max = Math.max(...values); const range = max - min || 1;
      const chartWidth = width - padding.left - padding.right; const chartHeight = height - padding.top - padding.bottom;
      context.clearRect(0, 0, width, height); context.font = '11px Arial'; context.fillStyle = '#6d786f'; context.strokeStyle = '#dce4de'; context.lineWidth = 1;
      [0, .5, 1].forEach((fraction) => { const y = padding.top + chartHeight * fraction; context.beginPath(); context.moveTo(padding.left, y); context.lineTo(width - padding.right, y); context.stroke(); const value = max - range * fraction; context.fillText(value.toFixed(1), 3, y + 4); });
      context.beginPath(); points.forEach((item, index) => { const x = padding.left + (index / (points.length - 1)) * chartWidth; const y = padding.top + (1 - (item.nav - min) / range) * chartHeight; if (index === 0) context.moveTo(x, y); else context.lineTo(x, y); }); context.strokeStyle = '#246b52'; context.lineWidth = 2.5; context.stroke();
      context.fillStyle = '#6d786f'; context.fillText(points[0].date.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }), padding.left, height - 6); const endLabel = points[points.length - 1].date.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }); context.fillText(endLabel, width - padding.right - context.measureText(endLabel).width, height - 6);
    }
    async function loadChart() {
      try {
        let schemeCode = providedCode;
        if (!schemeCode) { const matches = await fetch(`${baseUrl}/search?q=${encodeURIComponent(requestedName)}`).then((response) => response.json()); const growth = matches.find((item) => /direct plan.*growth/i.test(item.schemeName)); schemeCode = (growth || matches[0])?.schemeCode; }
        if (!schemeCode) throw new Error('No matching fund scheme was found.');
        const payload = await fetch(`${baseUrl}/${schemeCode}`).then((response) => response.json());
        history = (payload.data || []).map((item) => ({ date: parseDate(item.date), nav: Number(item.nav) })).filter((item) => Number.isFinite(item.nav) && !Number.isNaN(item.date.getTime())).sort((a, b) => a.date - b.date);
        if (!history.length) throw new Error('No NAV history is available for this scheme.');
        document.getElementById('fund-name').textContent = payload.meta?.scheme_name || requestedName;
        document.getElementById('fund-category').textContent = payload.meta?.scheme_category || 'Indian mutual fund';
        document.getElementById('latest-nav').textContent = history[history.length - 1].nav.toFixed(2);
        message.hidden = true; draw();
      } catch (error) { document.getElementById('fund-name').textContent = requestedName || 'Fund chart unavailable'; message.textContent = error.message || 'The chart could not be loaded.'; }
    }
    document.querySelectorAll('[data-months]').forEach((button) => button.addEventListener('click', () => { months = Number(button.dataset.months); document.querySelectorAll('[data-months]').forEach((item) => item.classList.toggle('is-active', item === button)); draw(); }));
    addEventListener('resize', draw); loadChart();
  </script>
</body>
</html>
